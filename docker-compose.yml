services:
  postgres:
    image: postgres:16
    container_name: pg_udi
    environment:
      POSTGRES_USER: admin_udi
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/postgresql_custom.conf:/etc/postgresql/postgresql.conf:ro
      - pg_logs:/var/log/postgresql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - pg_net
    # ports:                          
    #   - "5432:5432"                 

secrets:
  pg_password:
    file: ./secrets/pg_password.txt

volumes:
  pg_data:
  pg_logs:

networks:
  pg_net:
    driver: bridge